<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="A simple weather tracking app built with React and TypeScript." />
    <meta name="theme-color" content="#8d71d0" />
    <link rel="canonical" href="https://weather-app.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weather-app.vercel.app/" />
    <meta property="og:image" content="https://weather-app.vercel.app/weather-favicon.png" />
    <meta property="og:image:width" content="640" />

    <meta property="og:image:alt" content="Today's Weather app icon" />

    <meta name="twitter:card" content="summary_large_image" />

    <title>Today's Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the initial theme based on the user's preference or system settings
      try {
        const saved = JSON.parse(localStorage.getItem('weather:theme'))
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
